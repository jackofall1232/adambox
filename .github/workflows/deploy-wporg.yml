name: Deploy to WordPress.org

on:
  push:
    tags:
      - '[0-9]+\.[0-9]+\.[0-9]+'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify plugin version matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE="adambox.php"

          if [ ! -f "$FILE" ]; then
            echo "❌ Main plugin file not found: $FILE"
            exit 1
          fi

          VER=$(grep -Eoi '^.*Version:\s*[0-9]+\.[0-9]+\.[0-9]+' "$FILE" \
            | head -n1 \
            | sed -E 's/.*Version:\s*//')

          echo "🔎 Git tag: $TAG"
          echo "🔎 Plugin header version: $VER"

          if [ "$TAG" != "$VER" ]; then
            echo "❌ Tag ($TAG) does not match plugin Version header ($VER)"
            exit 1
          fi

          echo "✅ Version check passed"

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          slug: adambox
          assets-dir: .wordpress-org
        env:
          SVN_USERNAME: ${{ secrets.WPORG_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_PASSWORD }}
